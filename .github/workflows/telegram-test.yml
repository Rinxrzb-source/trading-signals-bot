name: Telegram connection test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send a harmless Telegram test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat_id:
              raise SystemExit("Missing Telegram GitHub Actions secrets")
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          payload = json.dumps({
              "chat_id": chat_id,
              "text": "✅ Phoenix Crypto Signals — Test Telegram réussi ! Aucun ordre ni signal de trading."
          }).encode("utf-8")
          request = urllib.request.Request(url, data=payload, headers={"Content-Type": "application/json"}, method="POST")
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)
                  if not result.get("ok"):
                      raise SystemExit("Telegram rejected test message")
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Telegram test failed (HTTP {error.code}); verify bot started and secrets") from None
          print("Telegram test message sent successfully")
          PY
